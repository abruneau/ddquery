# GoReleaser configuration for ddquery
# https://goreleaser.com
# This is a library package, so we focus on release management rather than binary distribution

project_name: ddquery

# No builds needed for library packages - GoReleaser will still create releases
# If you later add a CLI tool, uncomment and configure the builds section below
# builds:
#   - id: ddquery
#     main: ./cmd/ddquery
#     binary: ddquery
#     goos:
#       - linux
#       - windows
#       - darwin
#     goarch:
#       - amd64
#       - arm64
#     flags:
#       - -trimpath
#     ldflags:
#       - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

# Source archives for library releases
archives:
  - id: source
    format: tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_source'
    files:
      - LICENSE*
      - README.md
      - CHANGELOG.md
      - go.mod
      - go.sum
      - '*.go'
      - '!_examples/**'

# Snapshots
snapshot:
  name_template: "{{ .Tag }}-next"

# Changelog
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

# GitHub release
release:
  github:
    owner: '{{ .Env.GITHUB_REPOSITORY_OWNER }}'
    name: '{{ .Env.GITHUB_REPOSITORY }}'
  mode: replace
  header: |
    ## {{ .ProjectName }} {{ .Tag }}
    
    {{ .ReleaseNotes }}
  footer: |
    ---
    
    **Full Changelog**: {{ .URL }}/compare/{{ .PreviousTag }}...{{ .Tag }}

